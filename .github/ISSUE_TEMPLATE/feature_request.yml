name: Feature request
description: A job the bundle should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the engineering job, not the implementation. A request that names the format, the
        vendor software and the answer you expected is actionable; one that names a tool that should
        exist is not. Check the documentation map first, at
        https://github.com/KonnectSuite/dsh-engineering/blob/main/docs/index.md: the bundle may
        already do this under another product.
  - type: textarea
    id: job
    attributes:
      label: The engineering job to be done
      description: What you are trying to get done, what the bundle gives you today, and what the answer should look like.
      placeholder: Turn a FactoryTalk View ME display export into a list of tags that no controller logic writes.
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: The row the job belongs to. Choose the bundle itself for installation, the plugin list, the preset, the skills or a preview face.
      options:
        - Studio 5000 L5X
        - FactoryTalk View ME
        - FactoryTalk Optix
        - MotionWorks IEC
        - ECAD electrical prints
        - RSLogix 5 (PLC-5) program reads
        - SLC 500 / PLC-5 to Logix migration
        - The bundle itself
        - More than one, or not sure yet
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: The workaround or manual step you use now, and where it costs you time. Optional.
    validations:
      required: false
