<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="450" viewBox="0 0 1240 450" font-family="Segoe UI, Arial, sans-serif">
<rect width="1240" height="450" fill="#ffffff"/>
<text x="48" y="58" font-size="26" font-weight="600" fill="#1f2933">FactoryTalk View ME</text>
<text x="48" y="88" font-size="15" fill="#52606d">The agent exports the installed application, authors schema-validated screens, and proves the Studio import.</text>
<rect x="40" y="150" width="200" height="100" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="140" y="197" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">List applications</text>
<text x="140" y="219" text-anchor="middle" font-size="13" fill="#52606d">ftview_apps</text>
<rect x="270" y="150" width="200" height="100" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="370" y="197" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Export</text>
<text x="370" y="219" text-anchor="middle" font-size="13" fill="#52606d">vendor export server</text>
<rect x="500" y="150" width="200" height="100" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="600" y="197" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Author</text>
<text x="600" y="219" text-anchor="middle" font-size="13" fill="#52606d">displays and objects</text>
<rect x="730" y="150" width="200" height="100" rx="12" fill="#e9f6ee" stroke="#2f855a" stroke-width="2"/>
<text x="830" y="197" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Schema validate</text>
<text x="830" y="219" text-anchor="middle" font-size="13" fill="#52606d">Gfx-ME*.xsd</text>
<rect x="960" y="150" width="200" height="100" rx="12" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="1060" y="197" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Apply package</text>
<text x="1060" y="219" text-anchor="middle" font-size="13" fill="#52606d">BatchImport + IMPORT.md</text>
<rect x="960" y="280" width="200" height="70" rx="12" fill="#fff6e6" stroke="#b7791f" stroke-width="2"/>
<text x="1060" y="312" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Import in Studio</text>
<text x="1060" y="334" text-anchor="middle" font-size="13" fill="#52606d">human, two clicks</text>
<rect x="730" y="280" width="200" height="70" rx="12" fill="#e9f6ee" stroke="#2f855a" stroke-width="2"/>
<text x="830" y="312" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Verify import</text>
<text x="830" y="334" text-anchor="middle" font-size="13" fill="#52606d">object-by-object diff</text>
<line x1="240" y1="200" x2="270" y2="200" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="470" y1="200" x2="500" y2="200" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="700" y1="200" x2="730" y2="200" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="930" y1="200" x2="960" y2="200" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1060" y1="250" x2="1060" y2="280" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="1150" y="265" text-anchor="middle" font-size="12" fill="#52606d">hand off</text>
<line x1="960" y1="315" x2="930" y2="315" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<text x="945" y="303" text-anchor="middle" font-size="12" fill="#52606d">re-export</text>
<rect x="48" y="400" width="16" height="16" rx="4" fill="#eef4fb" stroke="#2f6fb3" stroke-width="2"/><text x="72" y="413" font-size="13" fill="#52606d">agent step, no UI</text>
<rect x="248" y="400" width="16" height="16" rx="4" fill="#fff6e6" stroke="#b7791f" stroke-width="2"/><text x="272" y="413" font-size="13" fill="#52606d">human step in vendor software</text>
<rect x="552" y="400" width="16" height="16" rx="4" fill="#e9f6ee" stroke="#2f855a" stroke-width="2"/><text x="576" y="413" font-size="13" fill="#52606d">proof step: re-read or vendor engine</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
</svg>