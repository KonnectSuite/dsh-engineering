<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="460" viewBox="0 0 1300 460" font-family="Segoe UI, Arial, sans-serif">
<rect width="1300" height="460" fill="#ffffff"/>
<text x="48" y="58" font-size="26" font-weight="600" fill="#1f2933"></text>
<text x="48" y="88" font-size="15" fill="#52606d"></text>
<rect x="40" y="140" width="210" height="100" rx="12" fill="#eaf2fe" stroke="#1f6feb" stroke-width="2"/>
<text x="145" y="187" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Open</text>
<text x="145" y="209" text-anchor="middle" font-size="13" fill="#52606d">open_project, overview</text>
<rect x="290" y="140" width="210" height="100" rx="12" fill="#eaf2fe" stroke="#1f6feb" stroke-width="2"/>
<text x="395" y="187" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Read and check</text>
<text x="395" y="209" text-anchor="middle" font-size="13" fill="#52606d">references, usage, run_checks</text>
<rect x="540" y="140" width="210" height="100" rx="12" fill="#eaf2fe" stroke="#1f6feb" stroke-width="2"/>
<text x="645" y="187" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Compose a rung</text>
<text x="645" y="209" text-anchor="middle" font-size="13" fill="#52606d">list_instructions, compose_rung</text>
<rect x="790" y="140" width="210" height="100" rx="12" fill="#eaf2fe" stroke="#1f6feb" stroke-width="2"/>
<text x="895" y="187" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Draft and validate</text>
<text x="895" y="209" text-anchor="middle" font-size="13" fill="#52606d">draft_*, draft_validate</text>
<rect x="1040" y="140" width="210" height="100" rx="12" fill="#e9f6ee" stroke="#2f855a" stroke-width="2"/>
<text x="1145" y="187" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Apply</text>
<text x="1145" y="209" text-anchor="middle" font-size="13" fill="#52606d">one NEW .L5X</text>
<rect x="1040" y="300" width="210" height="100" rx="12" fill="#fff6e6" stroke="#b7791f" stroke-width="2"/>
<text x="1145" y="347" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2933">Build</text>
<text x="1145" y="369" text-anchor="middle" font-size="13" fill="#52606d">SDK verify, rev 37+</text>
<line x1="250" y1="190" x2="290" y2="190" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="500" y1="190" x2="540" y2="190" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="750" y1="190" x2="790" y2="190" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1000" y1="190" x2="1040" y2="190" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1145" y1="240" x2="1145" y2="300" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="1235" y="270" text-anchor="middle" font-size="12" fill="#52606d">compile</text>
<rect x="48" y="410" width="16" height="16" rx="4" fill="#eef4fb" stroke="#2f6fb3" stroke-width="2"/><text x="72" y="423" font-size="13" fill="#52606d">agent step, no UI</text>
<rect x="248" y="410" width="16" height="16" rx="4" fill="#fff6e6" stroke="#b7791f" stroke-width="2"/><text x="272" y="423" font-size="13" fill="#52606d">human step in vendor software</text>
<rect x="552" y="410" width="16" height="16" rx="4" fill="#e9f6ee" stroke="#2f855a" stroke-width="2"/><text x="576" y="423" font-size="13" fill="#52606d">proof step: re-read or vendor engine</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/></marker></defs>
</svg>