<text x="291.5" y="203" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#E2E8F0">Motor_Control(Motor1_AOI,SystemRunning,StopPB,0,Motor_1.</text>
<text x="291.5" y="217" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#E2E8F0">Running,Motor_1.RunCommand,Motor_1.Faulted,Motor1_AOI.Running)</text>
<text x="20" y="256" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">2</text>
<text x="42" y="263" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">Fault detection - any motor fault sets FaultActive</text>
