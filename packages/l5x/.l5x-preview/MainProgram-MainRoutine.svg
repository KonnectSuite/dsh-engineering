<text x="20" y="166" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">1</text>
<text x="42" y="173" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">Motor 1 control via AOI - start when system running, stop on system stop</text>
<line x1="16" y1="206" x2="924" y2="206" stroke="#334155" stroke-width="1"/>
<line x1="16" y1="155" x2="16" y2="245" stroke="#64748B" stroke-width="2"/>
<line x1="924" y1="155" x2="924" y2="245" stroke="#64748B" stroke-width="2"/>
