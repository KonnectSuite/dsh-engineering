<line x1="16" y1="456" x2="16" y2="546" stroke="#64748B" stroke-width="2"/>
<line x1="924" y1="456" x2="924" y2="546" stroke="#64748B" stroke-width="2"/>
<rect x="42" y="490" width="158" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="121" y="511.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(SystemRunning)</text>
<rect x="216" y="490" width="181" height="34" rx="3" fill="#2A2117" stroke="#8A6A2F"/>
<text x="306.5" y="511.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">TON(MainTimer,1000,0)</text>
<text x="20" y="557" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">5</text>
<text x="42" y="564" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">Reset cycle timer on done</text>
<line x1="16" y1="597" x2="924" y2="597" stroke="#334155" stroke-width="1"/>
<line x1="16" y1="546" x2="16" y2="636" stroke="#64748B" stroke-width="2"/>
<line x1="924" y1="546" x2="924" y2="636" stroke="#64748B" stroke-width="2"/>
<rect x="42" y="580" width="150" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="117" y="601.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(MainTimer.DN)</text>
<rect x="208" y="580" width="150" height="34" rx="3" fill="#1B2436" stroke="#3B5BA5"/>
<text x="283" y="601.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">OTU(MainTimer.TT)</text>
<text x="20" y="647" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">6</text>
<text x="42" y="654" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">Set line speed when system running</text>
<line x1="16" y1="687" x2="924" y2="687" stroke="#334155" stroke-width="1"/>
<line x1="16" y1="636" x2="16" y2="726" stroke="#64748B" stroke-width="2"/>
<line x1="924" y1="636" x2="924" y2="726" stroke="#64748B" stroke-width="2"/>
<rect x="42" y="670" width="158" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="121" y="691.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(SystemRunning)</text>
<rect x="216" y="670" width="166" height="34" rx="3" fill="#16202E" stroke="#4B5B6E"/>
<text x="299" y="691.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">MOV(60.0,LineSpeed)</text>
