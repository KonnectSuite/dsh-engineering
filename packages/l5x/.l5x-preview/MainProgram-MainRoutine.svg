<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="738" viewBox="0 0 940 738">
<rect x="0" y="0" width="940" height="738" fill="#0B1220"/>
<text x="16" y="18" font-size="12" font-family="Segoe UI, Arial, sans-serif" fill="#94A3B8">MainProgram-MainRoutine</text>
<text x="20" y="45" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">0</text>
<text x="42" y="52" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">System start/stop - start seals in through SystemRunning, stop or E-stop breaks circuit</text>
