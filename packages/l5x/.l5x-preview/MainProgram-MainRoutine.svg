<text x="20" y="377" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">3</text>
<text x="42" y="384" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">Increment fault counter on rising edge of FaultActive</text>
<line x1="16" y1="417" x2="924" y2="417" stroke="#334155" stroke-width="1"/>
<line x1="16" y1="366" x2="16" y2="456" stroke="#64748B" stroke-width="2"/>
<line x1="924" y1="366" x2="924" y2="456" stroke="#64748B" stroke-width="2"/>
<rect x="42" y="400" width="142" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="113" y="421.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(FaultActive)</text>
<rect x="200" y="400" width="197" height="34" rx="3" fill="#2A2117" stroke="#8A6A2F"/>
<text x="298.5" y="421.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">CTU(CycleCounter,1,100)</text>
<text x="20" y="467" font-size="11" font-family="Consolas, monospace" fill="#7D8CA3">4</text>
<text x="42" y="474" font-size="11.5" font-family="Segoe UI, Arial, sans-serif" fill="#9FB0C6">Main cycle timer - 1 second heartbeat</text>
