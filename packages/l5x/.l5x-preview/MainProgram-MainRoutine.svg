<rect x="56" y="321" width="173" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="142.5" y="342.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(Motor_2.Faulted)</text>
