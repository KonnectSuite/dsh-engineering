<text x="111.5" y="89.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(StartPB)</text>
<rect x="56" y="110" width="158" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="135" y="131.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIC(SystemRunning)</text>
