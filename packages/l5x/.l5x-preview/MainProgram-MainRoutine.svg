<rect x="372" y="89" width="158" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="451" y="110.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIO(EmergencyStop)</text>
<rect x="546" y="89" width="142" height="34" rx="3" fill="#14251F" stroke="#2F6F55"/>
<text x="617" y="110.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">XIO(FaultActive)</text>
<rect x="704" y="89" width="158" height="34" rx="3" fill="#1B2436" stroke="#3B5BA5"/>
<text x="783" y="110.5" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#E2E8F0">OTE(SystemRunning)</text>
