# AryaCode engineering bundle.
#
# Six product rows, two support rows and one surface row, one switch each. A row mounts a product's whole surface —
# its read tools, its guidance and its optional parts — so the Plugins page
# shows a product per row instead of a surface per row.
#
# The optional parts are the row's config, not separate rows:
#
#   l5x    → editing, studio, live, allowWrites   (all on by default)
#   ftview → edit, studio                          (both on by default)
#   mwi    → edit                                  (on by default)
#   optix  → authoring, destructive, invoke, preview, netlogic (all on by default)
#   plc5   → (the row itself ships off)           (reads only; no writes switch)
#   slc    → (the row itself ships off)           (reads only; no writes switch)
#
# Every product except PLC-5 and SLC 500 ships on so a fresh install can use it.
# Both are new, read-only surfaces on a legacy platform, so they ship listed and
# disabled until a person enables them. Turn any row off from its Configure page
# when the profile is read-only or the request budget is tight; the schemas are
# sent on every request.
#
# The patch only ever inserts. It must never target a row another bundle owns:
# a profile without that row makes composition fail ("patch: entry ... not
# found"), which is why 0.4.0 and 0.4.1 could not be installed.
#
# There is no per-skill tool filter here (`policyOnly` / `toolPolicy`): that is
# an AryaAI harness feature and the AryaCode line's `@deepseek-ai/dsh-tool-skill`
# has no such config. The row is the switch.
- insert:
    - id: l5x
      name: '@aryacode/dsh-engineering/l5x'
    # FactoryTalk View ME: read, edits and the Studio handoff. Small enough that
    # everything is on; the row's config can drop the edits or the handoff.
    - id: ftview
      name: '@aryacode/dsh-engineering/ftview'
    # MotionWorks IEC: session, reads, verify and guidance on; edits opt-in.
    - id: mwi
      name: '@aryacode/dsh-engineering/mwi'
    # All three previews (the L5X ladder viewer, the FactoryTalk View ME display
    # preview and the DXF/DWG drawing preview) are this bundle's own client faces.
    # A package registers exactly one browser bundle, so one row mounts all three;
    # a client face adds no model context, so this row is independent of every
    # product row above.
    - id: viewers
      name: '@aryacode/dsh-engineering'
    # Cross-product engineering resources: a local standards corpus (IEC 61131-3,
    # Rockwell, Yaskawa, HMI and craft rules), a house-style profile read from the
    # open project, and the engineering-standards skill that says to read both
    # before authoring. Disable it in a lean profile; it adds no product row.
    - id: engineering-resources
      name: '@aryacode/dsh-engineering/resources'

    # SLC 500 / PLC-5 migration support: the assessment, the .L5K linter, the
    # conversion comparison and marker resolver, the signed migration report,
    # the resumable plan, and the legacy-to-logix-migration skill. The readers open
    # RSLogix 500 or RSLogix 5 hidden and never save; no controller is touched,
    # and nothing claims a file is migrated.
    - id: migration
      name: '@aryacode/dsh-engineering/migration'

    # RSLogix 5 (PLC-5) product row: the headless .RSP reader, the ladder in
    # neutral text, the ladder search, the I/O footprint census, the chassis
    # configuration, the data-file table, the processor identity and the
    # rslogix-5 skill. Every read opens the project hidden through the RSLogix 5
    # automation server and closes with the do-not-save flag; the container
    # reader answers from the file alone when RSLogix 5 is absent. The row ships
    # OFF (a new surface on a legacy platform) and writes nothing at all.
    - id: plc5
      name: '@aryacode/dsh-engineering/plc5'
      disabled: true

    # RSLogix 500 (SLC 500 and MicroLogix) product row: the offline text-export
    # reader, ladder and data-file reads, the I/O and processor census, the
    # documentation-export parser, slc500_docs and the rslogix-500 skill. The
    # automation-server path only reads a project hidden and never saves; the
    # text reader answers from an export alone. The row ships OFF (a read-only
    # surface on a legacy platform) and writes nothing at all.
    - id: slc
      name: '@aryacode/dsh-engineering/slc'
      disabled: true

    # FactoryTalk Optix: vendored like the other three products, so one install
    # carries every surface and no component package is a dependency.
    - id: optix
      name: '@aryacode/dsh-engineering/optix'