# AryaCode engineering bundle.
#
# Two layers live here.
#
# 1. Tool exposure. Targets the existing `tool-capability-policy` row and links
#    each engineering product's tool namespace to the skill that governs it, so
#    the Skills page switch controls the guidance and the tools together instead
#    of leaving the tool schemas exposed after the skill is off.
#
#    `onDemand` stays false. Arya measured bounded on-demand discovery against
#    eager exposure and kept eager exposure because discovery cost more turns
#    than the schema characters it saved. The context gain comes from per-product
#    switches and from trimming the product schemas.
#
#    Optix has no skill yet, so `optix_*` stays unlinked and always visible. Link
#    it here once a FactoryTalk Optix skill registers one.
#
# 2. The product rows. Mounts the rebuilt L5X and FactoryTalk View surfaces and
#    their guidance as components of this bundle. The row ids are stable, so per-entry enable
#    state survives upgrades even as the package behind them is rebuilt.
- id: tool-capability-policy
  config:
    policyOnly: true
    toolPolicy:
      onDemand: false
      capabilities:
        - skill: rockwell-l5x
          # The rebuilt L5X tools keep descriptive names (open_project,
          # draft_apply, ...). This exact list is what the skill switch
          # governs; `l5x_` stays linked for any prefixed tool added later.
          tools:
            - open_project
            - project_overview
            - list_components
            - get_component
            - search_logic
            - find_references
            - trace_dependencies
            - resolve_tag
            - usage_map
            - run_checks
            - compare_projects
            - draft_rung
            - draft_st
            - draft_routine
            - draft_tag
            - draft_tag_description
            - draft_udt_member
            - draft_udt_description
            - draft_validate
            - draft_apply
            - studio_sdk_status
            - studio_capabilities
            - export_acd_to_l5x
            - verify_offline_l5x
            - build_acd_from_draft
            - studio_review_evidence
            - controller_approval_status
            - capture_controller_snapshot
            - go_online
            - read_controller_mode
            - read_live_tag
            - change_controller_mode
            - download_project
            - poll_live_tags
            - start_plc_trend
          prefixes:
            - l5x_
        - skill: factorytalk-view
          prefixes:
            - ftview_
        - skill: motionworks-iec
          prefixes:
            - mw_
- insert:
    - id: l5x-read
      name: '@aryacode/dsh-engineering-l5x'
    - id: l5x-read-skill
      name: '@aryacode/dsh-engineering-l5x/skill'
    # Editing is its own entry so a read-only profile does not pay for nine
    # draft schemas. It consumes the read entry's project service.
    - id: l5x-editing
      name: '@aryacode/dsh-engineering-l5x/editing'
      disabled: true
    # The SDK entry needs Studio 5000 installed, so it stays off until asked for.
    - id: l5x-studio
      name: '@aryacode/dsh-engineering-l5x/studio'
      disabled: true
    # Live reads need a controller address; the row is the switch.
    - id: l5x-live
      name: '@aryacode/dsh-engineering-l5x/live'
      disabled: true
    # The ladder viewer is the bundle's own client face, independent of the tools.
    - id: l5x-viewer
      name: '@aryacode/dsh-engineering-l5x-viewer'
    # FactoryTalk View ME: read, edit and Studio entries plus the display
    # preview. The old plugin is retired, so these mount by default.
    - id: ftview-read
      name: '@aryacode/dsh-engineering-ftview'
    - id: ftview-read-skill
      name: '@aryacode/dsh-engineering-ftview/skill'
    - id: ftview-edit
      name: '@aryacode/dsh-engineering-ftview/edit'
    - id: ftview-studio
      name: '@aryacode/dsh-engineering-ftview/studio'
    - id: ftview-viewer
      name: '@aryacode/dsh-engineering-ftview-viewer'
    # MotionWorks IEC: the redesigned rows. Editing is off by default, like L5X.
    - id: mwi-session
      name: '@aryacode/dsh-engineering-mwi'
    - id: mwi-read
      name: '@aryacode/dsh-engineering-mwi/read'
    - id: mwi-read-skill
      name: '@aryacode/dsh-engineering-mwi/skill'
    - id: mwi-verify
      name: '@aryacode/dsh-engineering-mwi/verify'
    - id: mwi-edit
      name: '@aryacode/dsh-engineering-mwi/edit'
      disabled: true
    # FactoryTalk Optix stays a separate package, mounted as a component row.
    - id: optix
      name: '@aryacode/dsh-tool-ft-optix'
