# AryaCode engineering bundle.
#
# Five product rows, one switch each. A row mounts a product's whole surface —
# its read tools, its guidance and its optional parts — so the Plugins page
# shows a product per row instead of a surface per row.
#
# The optional parts are the row's config, not separate rows:
#
#   l5x    → editing, studio, live   (all off by default)
#   ftview → edit, studio            (both on by default)
#   mwi    → edit                    (off by default)
#
# That keeps the context decision with the product it belongs to: a read-only
# profile pays for the read surface, and the expensive schemas are one switch
# inside the row instead of four more toggles in the list.
#
# The patch only ever inserts. It must never target a row another bundle owns:
# a profile without that row makes composition fail ("patch: entry ... not
# found"), which is why 0.4.0 and 0.4.1 could not be installed.
#
# There is no per-skill tool filter here (`policyOnly` / `toolPolicy`): that is
# an AryaAI harness feature and the AryaCode line's `@deepseek-ai/dsh-tool-skill`
# has no such config. The row is the switch.
- insert:
    - id: l5x
      name: '@aryacode/dsh-engineering/l5x'
    # FactoryTalk View ME: read, edits and the Studio handoff. Small enough that
    # everything is on; the row's config can drop the edits or the handoff.
    - id: ftview
      name: '@aryacode/dsh-engineering/ftview'
    # MotionWorks IEC: session, reads, verify and guidance on; edits opt-in.
    - id: mwi
      name: '@aryacode/dsh-engineering/mwi'
    # Both previews (the L5X ladder viewer and the FactoryTalk View ME display
    # preview) are this bundle's own client face. A package registers exactly one
    # browser bundle, so one row mounts both; a client face adds no model
    # context, so this row is independent of every product row above.
    - id: viewers
      name: '@aryacode/dsh-engineering'
    # FactoryTalk Optix stays a separate package, mounted as a component row.
    - id: optix
      name: '@aryacode/dsh-tool-ft-optix'
