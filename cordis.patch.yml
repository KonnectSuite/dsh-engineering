# AryaCode engineering bundle.
#
# One layer lives here: the product rows. Each row mounts one surface of the
# bundle, and the row is the switch — disabling `l5x-editing`, `l5x-studio`,
# `l5x-live` or `mwi-edit` unloads that plugin, so its tool schemas never reach
# the request. Row ids are stable, so per-entry enable state survives upgrades
# even as the package behind a row is rebuilt.
#
# The patch only ever inserts. It must never target a row another bundle owns:
# a profile without that row makes composition fail ("patch: entry ... not
# found"), and in 0.4.0/0.4.1 that is exactly why the bundle could not be
# installed.
#
# The per-skill tool filter (`policyOnly` / `toolPolicy` / `capabilities`) is an
# AryaAI harness feature. The AryaCode line's `@deepseek-ai/dsh-tool-skill` has
# no such config, so a capability layer here would either fail composition or be
# rejected by the plugin's schema. Rows are the switch in this product; when
# that filter ships here, it belongs in a bundle mount of its own.
- insert:
    - id: l5x-read
      name: '@aryacode/dsh-engineering/l5x'
    - id: l5x-read-skill
      name: '@aryacode/dsh-engineering/l5x/skill'
    # Editing is its own entry so a read-only profile does not pay for nine
    # draft schemas. It consumes the read entry's project service.
    - id: l5x-editing
      name: '@aryacode/dsh-engineering/l5x/editing'
      disabled: true
    # The SDK entry needs Studio 5000 installed, so it stays off until asked for.
    - id: l5x-studio
      name: '@aryacode/dsh-engineering/l5x/studio'
      disabled: true
    # Live reads need a controller address; the row is the switch.
    - id: l5x-live
      name: '@aryacode/dsh-engineering/l5x/live'
      disabled: true
    # Both previews (the L5X ladder viewer and the FactoryTalk View ME display
    # preview) are this bundle's own client face. A package registers exactly one
    # browser bundle, so one row mounts both; switching the L5X or FTView *tools*
    # off leaves this row alone, because a client face adds no model context.
    - id: viewers
      name: '@aryacode/dsh-engineering'
    # FactoryTalk View ME: read, edit and Studio entries plus the display
    # preview. The old plugin is retired, so these mount by default.
    - id: ftview-read
      name: '@aryacode/dsh-engineering/ftview'
    - id: ftview-read-skill
      name: '@aryacode/dsh-engineering/ftview/skill'
    - id: ftview-edit
      name: '@aryacode/dsh-engineering/ftview/edit'
    - id: ftview-studio
      name: '@aryacode/dsh-engineering/ftview/studio'
    # MotionWorks IEC: the redesigned rows. Editing is off by default, like L5X.
    - id: mwi-session
      name: '@aryacode/dsh-engineering/mwi'
    - id: mwi-read
      name: '@aryacode/dsh-engineering/mwi/read'
    - id: mwi-read-skill
      name: '@aryacode/dsh-engineering/mwi/skill'
    - id: mwi-verify
      name: '@aryacode/dsh-engineering/mwi/verify'
    - id: mwi-edit
      name: '@aryacode/dsh-engineering/mwi/edit'
      disabled: true
    # FactoryTalk Optix stays a separate package, mounted as a component row.
    - id: optix
      name: '@aryacode/dsh-tool-ft-optix'
