# AryaAI engineering bundle.
#
# Two layers live here.
#
# 1. Tool exposure. Targets the existing `tool-capability-policy` row and links
#    each engineering product's tool namespace to the skill that governs it, so
#    the Skills page switch controls the guidance and the tools together instead
#    of leaving the tool schemas exposed after the skill is off.
#
#    `onDemand` stays false. Arya measured bounded on-demand discovery against
#    eager exposure and kept eager exposure because discovery cost more turns
#    than the schema characters it saved. The context gain comes from per-product
#    switches and from trimming the product schemas.
#
#    Optix has no skill yet, so `optix_*` stays unlinked and always visible. Link
#    it here once a FactoryTalk Optix skill registers one.
#
# 2. The L5X pilot. Mounts the rebuilt offline read surface as a component of
#    this bundle. The row id `l5x-read` is stable, so per-entry enable state
#    survives upgrades even as the package behind it is rebuilt.
- id: tool-capability-policy
  config:
    policyOnly: true
    toolPolicy:
      onDemand: false
      capabilities:
        - skill: rockwell-l5x
          prefixes:
            - l5x_
        - skill: factorytalk-view
          prefixes:
            - ftview_
        - skill: motionworks-iec
          prefixes:
            - mw_
- insert:
    - id: l5x-read
      name: dsh-engineering-l5x
